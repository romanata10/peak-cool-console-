name: Build experimental mod
on:
  push:
    branches:
      - 'arena/1f062e66-peak-cool-console'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Inspect AdvancedConsole signatures
        run: python3 tools/inspect_advancedconsole.py
      - name: Test package builder
        run: python3 -m unittest discover -s tests -v
      - name: Build using public reference assemblies
        run: dotnet build src/PeakCoolConsole.csproj -c Release -p:PublicReferences=true
      - name: Make Thunderstore zip
        run: python3 package/build_zip.py src/bin/Release/netstandard2.1/PeakCoolConsole.dll PeakCoolConsoleHelper-0.5.0.zip
      - name: Upload experimental build
        uses: actions/upload-artifact@v4
        with:
          name: PeakCoolConsoleHelper-experimental
          path: |
            PeakCoolConsoleHelper-0.5.0.zip
            src/bin/Release/netstandard2.1/PeakCoolConsole.dll
          if-no-files-found: error
      - name: Put build in branch folder
        if: github.ref == 'refs/heads/arena/1f062e66-peak-cool-console'
        run: |
          mkdir -p releases/PeakCoolConsoleHelper
          cp src/bin/Release/netstandard2.1/PeakCoolConsole.dll releases/PeakCoolConsoleHelper/
          cp PeakCoolConsoleHelper-0.5.0.zip releases/PeakCoolConsoleHelper/
          (cd releases/PeakCoolConsoleHelper && sha256sum PeakCoolConsoleHelper-0.5.0.zip PeakCoolConsole.dll > SHA256SUMS.txt)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f releases/PeakCoolConsoleHelper/PeakCoolConsole.dll releases/PeakCoolConsoleHelper/PeakCoolConsoleHelper-0.5.0.zip releases/PeakCoolConsoleHelper/SHA256SUMS.txt research/advancedconsole-signatures.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Add experimental compiled mod package'
            git push origin HEAD:refs/heads/arena/1f062e66-peak-cool-console
          fi
